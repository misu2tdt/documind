name: documind-integration-test

services:
  postgres-integration:
    image: pgvector/pgvector:pg16
    container_name: documind_pg_integration_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind_integration_test
    ports:
      - '${TEST_DB_PORT:-5435}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d documind_integration_test']
      interval: 2s
      timeout: 3s
      retries: 15
